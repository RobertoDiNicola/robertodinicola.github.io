const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.s),iterations:DATA.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.i)},key,b64(DATA.c));
  return new TextDecoder().decode(pt);
}
function fit(){
  const w=document.getElementById('pages').clientWidth;const k=Math.min(1,w/794);
  document.querySelectorAll('.slot').forEach(s=>{s.style.width=794*k+'px';s.style.height=1123*k+'px';s.firstElementChild.style.transform='scale('+k+')';});
}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Verifica…';
  try{
    const html=await unlock(document.getElementById('pw').value);
    document.getElementById('pages').innerHTML=html;
    document.getElementById('lock').style.display='none';
    document.getElementById('viewer').style.display='block';
    fit();window.addEventListener('resize',fit);
    document.title='CV | Roberto Di Nicola';
  }catch(x){
    err.textContent='> accesso negato: password errata.';
    document.getElementById('pw').select();
  }finally{go.disabled=false;go.textContent='Sblocca';}
});
document.getElementById('print').addEventListener('click',()=>window.print());
